name: Deploy News Site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (if any)
        run: npm install

      - name: Generate news (single run)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ESTIMATED_RPM_USD: ${{ secrets.ESTIMATED_RPM_USD || '1.5' }}
        run: npm run generate:once

      - name: Persist budget & analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add editorial-logs/budget.json news/analytics-summary.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update budget & analytics [skip ci]"
          git push || true

      - name: Build static artifact
        run: |
          mkdir -p dist
          cp *.html dist/
          cp styles.css dist/
          cp script.js dist/
          if [ -f ads.txt ]; then cp ads.txt dist/; fi
          cp .nojekyll dist/
          if [ -f CNAME ]; then cp CNAME dist/; fi
          cp -r news dist/news
          cp -r assets dist/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

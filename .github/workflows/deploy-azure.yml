name: Deploy Noticias → Azure Static Web Apps

# ──────────────────────────────────────────────────────────────────────────────
# Workflow separado para Azure SWA de "Artilleros del Caos - Noticias"
# NO interfiere con el otro proyecto Azure que ya tienes.
# Requiere un secret llamado AZURE_STATIC_WEB_APPS_API_TOKEN_NOTICIAS
# (nombre distinto al del otro proyecto para no mezclarse)
#
# Cómo obtener el token:
#   1. Azure Portal → Static Web Apps → tu app de noticias → Manage deployment token
#   2. GitHub repo → Settings → Secrets → Actions → New secret
#      Nombre: AZURE_STATIC_WEB_APPS_API_TOKEN_NOTICIAS
#      Valor:  el token copiado de Azure
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "10 */1 * * *"   # cada hora, 10 minutos después del de GitHub Pages
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  generate-and-deploy:
    name: Generar noticias + Deploy Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # necesario para git push del budget

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Generar noticias (Sara + presupuesto 5€/mes)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ESTIMATED_RPM_USD: "1.5"
        run: npm run generate:once

      - name: Persistir budget y analytics en repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add editorial-logs/budget.json news/analytics-summary.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(azure): update budget & analytics [skip ci]"
          git push || true

      - name: Construir artefacto estático
        run: |
          mkdir -p dist
          cp *.html dist/
          cp styles.css dist/
          cp script.js dist/
          cp staticwebapp.config.json dist/
          [ -f ads.txt ] && cp ads.txt dist/ || true
          [ -f CNAME ]   && cp CNAME dist/   || true
          [ -f robots.txt ] && cp robots.txt dist/ || true
          cp -r news   dist/news
          cp -r assets dist/assets

      - name: Deploy a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NOTICIAS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ""

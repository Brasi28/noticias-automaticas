<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noticias Automáticas | Tecnología, IA, Deportes, Economía y más</title>
    <meta
      name="description"
      content="Portal automático de noticias con resúmenes optimizados SEO sobre tecnología, inteligencia artificial, deportes, economía, videojuegos y entretenimiento."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph para compartir en redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Noticias Automáticas - Cobertura en tiempo real" />
    <meta
      property="og:description"
      content="Noticias actualizadas automáticamente cada 30 minutos con diseño moderno y optimización SEO."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <!-- JSON-LD del sitio para SEO técnico -->
    <script type="application/ld+json" id="website-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Noticias Automáticas",
        "url": "./",
        "inLanguage": "es",
        "description": "Portal automático con noticias resumidas y optimizadas para SEO.",
        "publisher": {
          "@type": "Organization",
          "name": "Noticias Automáticas"
        }
      }
    </script>
  </head>
  <body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <header class="site-header">
      <p class="eyebrow">Actualización automática cada 30 minutos</p>
      <h1>Noticias que se publican solas, listas para posicionar</h1>
      <p class="lead">
        Cobertura de Tecnología, Inteligencia Artificial, Deportes, Economía, Videojuegos y Entretenimiento.
      </p>
      <div class="header-meta">
        <span id="last-update">Cargando fecha de actualización...</span>
        <button id="refresh-btn" type="button" aria-label="Actualizar noticias">Actualizar ahora</button>
      </div>
    </header>

    <main>
      <section class="cards-grid" id="news-container" aria-live="polite">
        <!-- Las tarjetas de noticias se insertan automáticamente desde script.js -->
      </section>
    </main>

    <template id="news-card-template">
      <article class="news-card">
        <img class="news-image" alt="Miniatura de la noticia" loading="lazy" />
        <div class="news-content">
          <p class="news-category"></p>
          <h2 class="news-title"></h2>
          <p class="news-summary"></p>
          <div class="news-footer">
            <time class="news-date"></time>
            <a class="news-link" target="_blank" rel="noopener noreferrer">Leer noticia</a>
          </div>
        </div>
      </article>
    </template>

    <script src="script.js" defer></script>
  </body>
</html>
